<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            margin: 50px;
            background: red;
            /* animation: animate 2s linear ease-in infinite; */
            animation-name: animate;
            animation-duration: 0.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes animate{
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Tara Baji Loi Loi</h1>
    <div class="box">

    </div>
</body>
</html>
